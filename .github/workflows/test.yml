name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Stub the Windows tray helper (built with csc.exe on Windows only)
        run: printf x > companion/tray/tray.exe
      - name: Hub self-test
        working-directory: companion
        run: bun selftest.js
      - name: Extension tests
        run: bun extension/test/extension.test.js
