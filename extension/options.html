<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Agent Multi Tab Use</title>
		<link rel="icon" href="icons/icon32.png" />
		<link rel="stylesheet" href="dashboard.css" />
	</head>
	<body>
		<main>
			<header>
				<img src="icons/icon128.png" alt="" />
				<h1>Agent Multi Tab Use</h1>
				<span id="status" class="pill off" aria-live="polite"><i></i><span>Checking…</span></span>
			</header>

			<div class="banner" id="appBanner" hidden>
				<span>The companion app isn't running, so agents can't connect.</span>
				<a class="btn" id="download" target="_blank" rel="noopener">Get the app</a>
			</div>

			<div class="stats">
				<div><b id="total">0</b><span>agents</span></div>
				<div><b id="claimed">0</b><span>tabs</span></div>
				<div><b id="free">0</b><span>free ports</span></div>
			</div>

			<section class="card">
				<div class="card-head">
					<h2>Agents</h2>
					<button class="btn ghost" id="cleanup" type="button" title="Close tabs agents left behind (never ones you looked at) and remove their tab groups">Clean up groups</button>
				</div>
				<div id="agents" class="agents"></div>
			</section>

			<section class="card">
				<label class="toggle">
					<span>
						<b>Let agents see my own tabs</b>
						<small>Agents can use tabs you opened. They never see each other's.</small>
					</span>
					<input type="checkbox" id="shareTabs" />
					<i aria-hidden="true"></i>
				</label>
			</section>

			<section class="card">
				<div class="card-head">
					<h2>Connect an agent</h2>
				</div>
				<div class="copy">
					<input id="promptGroup" value="Agents" spellcheck="false" aria-label="Tab group name" placeholder="Tab group name" />
					<button class="btn primary" id="copyPrompt" type="button">Copy instructions</button>
				</div>
				<details>
					<summary>Preview</summary>
					<pre id="prompt"></pre>
				</details>
			</section>

			<footer id="foot">Runs only on this PC (127.0.0.1). Idle agents are released after 15 minutes.</footer>
		</main>
		<div class="toast" id="toast" role="status"></div>
		<script src="config.js"></script>
		<script src="agent-prompt.js"></script>
		<script src="options.js"></script>
	</body>
</html>
